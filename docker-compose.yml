# docker-compose for All-Hack v2 (AutoPentester foundation).
#
# Services:
#   * postgres   - primary store (engagements, jobs, findings, proxy flows)
#   * redis      - arq worker queue + transient state
#   * backend    - FastAPI + mitmproxy addon + arq worker (single image, two roles)
#   * frontend   - React build served by nginx
#
# All persistent state lives in volumes; nothing important is in container fs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: allhack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allhack}
      POSTGRES_USER: ${POSTGRES_USER:-allhack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allhack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allhack} -d ${POSTGRES_DB:-allhack}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not exposed to the host by default; backend reaches it on the internal
    # network. Uncomment to inspect with psql from the host.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: allhack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allhack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - MITM_PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-allhack}:${POSTGRES_PASSWORD:-allhack}@postgres:5432/${POSTGRES_DB:-allhack}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      # Bind mount: mitmproxy CA cert lives here, users download it from /api/proxy/ca.pem.
      - ./data:/data
    cap_add:
      - NET_ADMIN

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allhack-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-allhack}:${POSTGRES_PASSWORD:-allhack}@postgres:5432/${POSTGRES_DB:-allhack}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Same /data as the backend so the worker can read mitmproxy's CA dir
      # if a wrapper ever needs to (none today, but keeps things flexible).
      - ./data:/data
    # Same image, different entrypoint: arq picks scan jobs off Redis and
    # runs nuclei/sqlmap/ffuf/dalfox/nmap/etc.
    entrypoint: []
    command: ["arq", "app.workers.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allhack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  redis-data:
